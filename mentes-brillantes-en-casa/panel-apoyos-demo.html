<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel interno · Mentes Brillantes</title><style>
:root{--b:#0b4aa2;--s:#149ddd;--ink:#17324d;--mut:#667085;--line:#d9ecf8;--bg:#f5f9fc}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1120px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.login{max-width:480px;margin:60px auto}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #bcd8e8;border-radius:13px;font:inherit}.btn{border:0;border-radius:999px;padding:13px 18px;background:linear-gradient(135deg,var(--b),var(--s));color:#fff;font-weight:900;cursor:pointer}.mut{color:var(--mut)}.layout{display:grid;grid-template-columns:.75fr 1.25fr;gap:16px}.search{width:100%;padding:13px;border:1px solid #bcd8e8;border-radius:13px;margin-bottom:14px}.lead{margin-bottom:9px;cursor:pointer}.lead.on{border:2px solid var(--s)}.badge{display:inline-block;padding:6px 9px;border-radius:99px;background:#eaf8ff;color:var(--b);font-size:12px;font-weight:900}.section{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}.tags span{display:inline-block;margin:3px;padding:7px 9px;border-radius:99px;background:#eef8ff;color:#24506d;font-size:13px}.hide{display:none!important}.error{color:#a33;margin-top:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body>
<header><div><b>Mentes Brillantes</b><div class="mut">Panel interno · Apoyo educativo</div></div><button id="logout" class="btn hide">Cerrar sesión</button></header><main>
<section id="login" class="card login"><div class="badge">ACCESO INTERNO</div><h1>Equipo Mentes Brillantes</h1><p class="mut">Inicia sesión con un usuario autorizado para consultar solicitudes y reconstruir sus mapas.</p><div class="field"><label>Correo</label><input id="email" type="email"></div><div class="field"><label>Contraseña</label><input id="password" type="password"></div><button id="loginBtn" class="btn">Entrar</button><p id="loginMsg" class="error"></p></section>
<section id="app" class="hide"><div class="layout"><div><h2>Niños / solicitudes</h2><input id="search" class="search" placeholder="Buscar por nombre…"><div id="leads"></div></div><div id="profile" class="card"><p class="mut">Selecciona un niño para ver su mapa.</p></div></div></section></main>
<script>
const URL='https://jtdhangwuhnrvdlhadcu.supabase.co',KEY='sb_publishable_pKwzrq46JzV8P6AXLniexQ_qkwZlVTf';let token='',rows=[];
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function login(){try{$('#loginMsg').textContent='';const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});if(!r.ok)throw new Error('No fue posible iniciar sesión.');const j=await r.json();token=j.access_token;sessionStorage.setItem('mb_staff_token',token);await load()}catch(e){$('#loginMsg').textContent=e.message}}
async function load(){try{rows=await api('/rest/v1/solicitudes?select=*&order=created_at.desc');$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#logout').classList.remove('hide');renderList()}catch(e){sessionStorage.removeItem('mb_staff_token');token='';$('#loginMsg').textContent='Este usuario no tiene acceso a las solicitudes.'}}
function renderList(q=''){const a=rows.filter(r=>(r.nombre_nino||'').toLowerCase().includes(q.toLowerCase()));$('#leads').innerHTML=a.length?a.map(r=>'<div class="card lead" data-id="'+r.id+'"><b>'+esc(r.nombre_nino)+' · '+esc(r.edad)+' años</b><p class="mut">'+esc(r.grado||'Grado no indicado')+'</p><span class="badge">'+esc(r.estado||'nueva')+'</span></div>').join(''):'<div class="card mut">No se encontraron solicitudes.</div>';document.querySelectorAll('.lead').forEach(x=>x.onclick=()=>show(rows.find(r=>r.id===x.dataset.id)))}
function tags(a){return (Array.isArray(a)&&a.length?a:['Sin información registrada']).map(x=>'<span>'+esc(x)+'</span>').join('')}
function show(r){$('#profile').innerHTML='<div class="badge">MAPA INICIAL DE APOYOS</div><h1>'+esc(r.nombre_nino)+'</h1><p class="mut">'+esc(r.edad)+' años · '+esc(r.grado||'Grado no indicado')+'</p><div class="section"><h3>⭐ Fortalezas e intereses</h3><div class="tags">'+tags(r.fortalezas)+'</div></div><div class="section"><h3>🌱 Capacidades / apoyos de interés</h3><div class="tags">'+tags(r.apoyos_interes)+'</div></div><div class="section"><h3>👀 Situación observada por la familia</h3><p>'+esc(r.observacion||'Sin observación registrada')+'</p></div><div class="section"><h3>Contacto familiar</h3><p><b>'+esc(r.nombre_acudiente)+'</b><br>'+esc(r.whatsapp)+(r.email?'<br>'+esc(r.email):'')+'</p></div><div class="section"><p class="mut">Este mapa organiza información inicial y no constituye un diagnóstico.</p></div>'}
$('#loginBtn').onclick=login;$('#search').oninput=e=>renderList(e.target.value);$('#logout').onclick=()=>{sessionStorage.removeItem('mb_staff_token');location.reload()};token=sessionStorage.getItem('mb_staff_token')||'';if(token)load();
</script></body></html>
